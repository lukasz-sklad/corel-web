<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Corel Web — VectorCraft</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link rel="modulepreload" href="./vectorcraft-web-176190d24f086382.js">
  <link rel="preload" href="./vectorcraft-web-176190d24f086382_bg.wasm" as="fetch" type="application/wasm" crossorigin="anonymous">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1e1e1e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #e0e0e0;
    }
    #vectorcraft_canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }
    #vectorcraft_loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1e1e1e;
      z-index: 100;
      padding: 24px;
      text-align: center;
      user-select: none;
    }
    .loading-card {
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 12px;
      padding: 32px 28px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .app-icon {
      width: 56px;
      height: 56px;
      margin-bottom: 4px;
    }
    .app-title {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      margin: 0;
      letter-spacing: -0.3px;
    }
    .app-subtitle {
      font-size: 13px;
      color: #9e9e9e;
      margin: 0;
    }
    .progress-container {
      width: 100%;
      background: #181818;
      border-radius: 8px;
      height: 8px;
      overflow: hidden;
      position: relative;
      margin: 8px 0 4px;
      border: 1px solid #333333;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 8px;
      transition: width 0.15s ease-out;
    }
    .progress-info {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #888888;
    }
    .status-text {
      font-size: 14px;
      color: #d1d5db;
      min-height: 20px;
    }
    .troubleshoot-hint {
      display: none;
      margin-top: 12px;
      font-size: 12px;
      color: #9ca3af;
      background: #222222;
      border: 1px solid #383838;
      border-radius: 6px;
      padding: 10px 14px;
      line-height: 1.4;
    }
    .troubleshoot-hint a {
      color: #60a5fa;
      text-decoration: underline;
      cursor: pointer;
    }
    .troubleshoot-hint a:hover {
      color: #93c5fd;
    }
    .error-box {
      display: none;
      background: #3b1818;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      padding: 14px;
      border-radius: 8px;
      font-size: 13px;
      text-align: left;
      width: 100%;
      line-height: 1.4;
      word-break: break-word;
    }
    .error-box a {
      color: #93c5fd;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <canvas id="vectorcraft_canvas"></canvas>

  <div id="vectorcraft_loading">
    <div class="loading-card">
      <img src="./favicon.svg" alt="Corel Web" class="app-icon">
      <h1 class="app-title">Corel Web</h1>
      <p class="app-subtitle">VectorCraft &bull; Grafika wektorowa &bull; Obsługa plików CDR</p>

      <div class="status-text" id="status_text">Inicjalizacja pobierania…</div>

      <div class="progress-container">
        <div class="progress-bar" id="progress_bar"></div>
      </div>

      <div class="progress-info">
        <span id="progress_bytes">0 MB / ~21 MB</span>
        <span id="progress_pct">0%</span>
      </div>

      <div class="troubleshoot-hint" id="troubleshoot_hint">
        Ładowanie trwa dłużej niż zwykle?<br>
        Twoja karta graficzna może wymagać trybu WebGL2.<br>
        <a href="?webgl" id="webgl_link">Kliknij tutaj, aby uruchomić w trybie zgodności WebGL2</a>.
      </div>

      <div class="error-box" id="error_box"></div>
    </div>
  </div>

  <script type="module">
    import init, * as bindings from './vectorcraft-web-176190d24f086382.js';

    const statusEl = document.getElementById('status_text');
    const progressBar = document.getElementById('progress_bar');
    const progressBytes = document.getElementById('progress_bytes');
    const progressPct = document.getElementById('progress_pct');
    const troubleshootHint = document.getElementById('troubleshoot_hint');
    const errorBox = document.getElementById('error_box');

    // Pokazuj podpowiedź WebGL po 7 sekundach jeśli nadal się ładuje
    const hintTimer = setTimeout(() => {
      if (troubleshootHint && !window.location.search.includes('webgl')) {
        troubleshootHint.style.display = 'block';
      }
    }, 7000);

    function setStatus(text) {
      if (statusEl) statusEl.textContent = text;
    }

    function setProgress(loaded, total) {
      const pct = Math.min(100, Math.max(0, Math.round((loaded / total) * 100)));
      if (progressBar) progressBar.style.width = pct + '%';
      if (progressPct) progressPct.textContent = pct + '%';
      const loadedMB = (loaded / (1024 * 1024)).toFixed(1);
      const totalMB = (total / (1024 * 1024)).toFixed(1);
      if (progressBytes) progressBytes.textContent = `${loadedMB} MB / ${totalMB} MB`;
    }

    function showError(err) {
      clearTimeout(hintTimer);
      if (statusEl) statusEl.textContent = 'Błąd uruchamiania';
      if (errorBox) {
        errorBox.style.display = 'block';
        errorBox.innerHTML = `
          <strong>Wystąpił problem:</strong><br>
          ${err?.message || err || 'Nieznany błąd'}<br><br>
          <a href="?webgl">Spróbuj uruchomić z parametrem ?webgl (WebGL2)</a><br>
          <a href="javascript:location.reload()">Odśwież stronę</a>
        `;
      }
    }

    async function start() {
      try {
        setStatus('Pobieranie Corel Web (WebAssembly)…');
        const wasmUrl = './vectorcraft-web-176190d24f086382_bg.wasm';
        const response = await fetch(wasmUrl);

        if (!response.ok) {
          throw new Error(`Nie udało się pobrać silnika WebAssembly: HTTP ${response.status} ${response.statusText}`);
        }

        const contentLength = response.headers.get('content-length');
        const expectedBytes = contentLength ? parseInt(contentLength, 10) : 21284837;

        let wasmModuleOrBuffer;

        if (response.body && typeof response.body.getReader === 'function') {
          const reader = response.body.getReader();
          let loaded = 0;
          const chunks = [];

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value);
            loaded += value.length;
            // Przeglądarka może dekompresować strumień w locie (do ~60MB)
            const activeTotal = (expectedBytes < 30000000 && loaded > 30000000) ? 60601207 : expectedBytes;
            setProgress(loaded, activeTotal);
          }

          setStatus('Inicjalizacja silnika graficznego…');
          if (progressPct) progressPct.textContent = '100%';
          if (progressBar) progressBar.style.width = '100%';

          const fullBuffer = new Uint8Array(loaded);
          let offset = 0;
          for (const chunk of chunks) {
            fullBuffer.set(chunk, offset);
            offset += chunk.length;
          }
          wasmModuleOrBuffer = fullBuffer;
        } else {
          wasmModuleOrBuffer = await response.arrayBuffer();
        }

        setStatus('Uruchamianie interfejsu VectorCraft…');
        const wasm = await init({ module_or_path: wasmModuleOrBuffer });
        clearTimeout(hintTimer);

        window.wasmBindings = bindings;
        window.dispatchEvent(new CustomEvent("TrunkApplicationStarted", { detail: { wasm } }));
      } catch (err) {
        console.error('Corel Web startup error:', err);
        showError(err);
      }
    }

    start();
  </script>
</body>
</html>
